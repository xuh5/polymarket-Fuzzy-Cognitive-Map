# dbt 项目：把 data/bronze/ 下的 Parquet 原始归档加工成 silver（staging）和 gold（marts）
# 在 dbt/ 目录下运行：dbt run / dbt test / dbt build
name: pmdata
version: "1.0.0"
profile: pmdata

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

models:
  pmdata:
    # 先每次全部重建（数据量小，几秒算完）；以后跑不动了再改成 incremental
    staging:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
