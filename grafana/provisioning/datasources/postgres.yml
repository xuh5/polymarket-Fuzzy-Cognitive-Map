# Grafana 启动时自动创建的数据源（uid 固定，看板 JSON 里按 uid 引用）
apiVersion: 1
datasources:
  - name: Postgres
    uid: pm-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: pm
    isDefault: true
    jsonData:
      database: pm
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
