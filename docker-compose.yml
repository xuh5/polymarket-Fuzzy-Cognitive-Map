# 所有服务共用的日志设置：日志文件最大 10MB，最多留 5 个，防止日志把硬盘写满
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Airflow 各组件共用的设置（精简部署：LocalExecutor，任务直接在 scheduler 容器里跑，不需要 Redis 和 worker）
x-airflow-common: &airflow-common
  build: ./airflow
  image: polymarket-airflow
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_started
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # 网页登录用 FAB（用户名 + 密码），和官方 compose 一样
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # 元数据库（DAG 运行记录、任务状态）放在现有 postgres 的 airflow 库里，不另起数据库容器
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    # Airflow 3 里任务通过 api-server 汇报状态，各组件用同一个 JWT 密钥互相认证
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"               # 不加载几十个示例 DAG
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"  # 新 DAG 默认暂停，手动确认后再打开
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}         # 任务失败通知（airflow/dags/notify.py）
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro   # 改 DAG 不用重建镜像，dag-processor 会自动重新读
    - airflow-logs:/opt/airflow/logs        # 任务日志：scheduler 写、api-server 读给网页看，所以共用一个卷
  logging: *logging

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    restart: unless-stopped          # Docker 启动时自动把 Kafka 拉起来
    ports:
      - "9092:9092"                  # 台式机上的 Python 程序从这个口连 Kafka
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller    # 一个节点身兼两职，不需要 ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # 写错 topic 名时报错，而不是悄悄新建
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168           # 数据在 Kafka 里保留 7 天
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data         # 数据存在 Docker 卷里，容器重建也不会丢

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"                  # 网页界面
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # 每小时从 Gamma API 拉一次市场，写 pm.raw.markets（含已关闭市场的 tombstone）
  fetch-markets:
    build: .
    image: polymarket-app
    container_name: fetch-markets
    restart: unless-stopped          # 崩溃、Docker 重启后自动拉起
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092   # 容器之间走内部地址
    command: python -m pmdata.ingest.fetch_markets --every 3600
    logging: *logging

  # 一直运行：WebSocket 采集订单簿/成交写 pm.raw.clob，每小时重新筛一次订阅名单
  collect-clob:
    build: .
    image: polymarket-app            # 和 fetch-markets 共用同一个镜像（第二次构建直接命中缓存）
    container_name: collect-clob
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    command: python -m pmdata.ingest.collect_clob
    logging: *logging

  # 每 10 分钟轮询一次评论接口，新增或有变化的评论写 pm.raw.comments
  collect-comments:
    build: .
    image: polymarket-app
    container_name: collect-comments
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    command: python -m pmdata.ingest.collect_comments --every 600
    logging: *logging

  # 一直运行：读三个 raw topic，每 5 分钟写一批 Parquet 到 data/bronze/（文件写成功后才提交 offset）
  archiver:
    build: .
    image: polymarket-app
    container_name: archiver
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PM_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data             # 归档文件直接落在宿主机 D:\polymarket\data
    stop_grace_period: 60s           # docker stop 后给它时间写完手里的数据再退出（默认只等 10 秒）
    command: python -m pmdata.archive.archiver
    logging: *logging

  # 一直运行：读 pm.raw.clob 重建订单簿、算实时指标，写 pm.metrics.book / pm.metrics.trades
  # 启动时先往回重放 24 小时预热（约 170 万条，一两分钟），之后才开始输出
  metrics:
    build: .
    image: polymarket-app
    container_name: metrics
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_URL: redis://redis:6379/0
    command: python -m pmdata.metrics.run
    logging: *logging

  # 看板用的数据库。密码在 .env（不进 Git），compose 自动读取
  postgres:
    image: postgres:17.6
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"                  # 宿主机程序 / 调试用
    environment:
      POSTGRES_USER: pm
      POSTGRES_DB: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    logging: *logging

  # 当前订单簿的缓存：metrics 每秒写进来，网站后端读。只当缓存用，不存盘（丢了 metrics 下一秒会重写）
  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb"]
    ports:
      - "127.0.0.1:6379:6379"        # 只给本机程序用，不对外
    logging: *logging

  # 一直运行：读 pm.metrics.* 和 pm.raw.markets，upsert 进 Postgres（数据库提交后才提交 offset）
  pg-sink:
    build: .
    image: polymarket-app
    container_name: pg-sink
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: python -m pmdata.sink.pg_writer
    logging: *logging

  # 管道健康：每分钟记录各 consumer group 的消费积压、延迟、断线重连、行情质量（乱序 / 盘口对不上），写进 Postgres
  health:
    build: .
    image: polymarket-app
    container_name: health
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: python -m pmdata.health.run
    logging: *logging

  # 网站后端（FastAPI）：只读 Postgres 和 Redis，不连 Kafka
  api:
    build: .
    image: polymarket-app
    container_name: api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PG_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"        # 只给本机用；以后对外由 Cloudflare Tunnel 转发
    command: python -m pmdata.api.app --host 0.0.0.0
    logging: *logging

  # 看板：数据源和看板都写成文件放在 grafana/ 下（provisioning），重建容器不会丢
  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"                  # 网页界面，VS Code 端口转发后访问 localhost:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # 数据源配置文件里用 $POSTGRES_PASSWORD 引用
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}   # 告警发到 Discord（provisioning/alerting/alerts.yml 里引用）
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    logging: *logging

  # 一次性：建/升级 Airflow 元数据库的表、创建网页 admin 用户，做完就退出（其他 Airflow 组件等它成功后才启动）
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command: version                  # 官方镜像的入口脚本先按下面两个开关做完初始化，再执行 airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  # 网页界面 + REST API；任务也通过它汇报状态。kafka-ui 占了 8080，宿主机用 8081，只绑本机（VS Code 端口转发访问）
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 调度器：到点创建 DAG 运行、排任务；LocalExecutor 下任务就在这个容器里执行（所以 dbt 要用的目录挂在这里）
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      # 保持 dbt/ 和 data/ 的相对位置不变，profiles.yml 里的 ../data/warehouse.duckdb 才能找到
      - ./dbt:/opt/project/dbt
      - ./data:/opt/project/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 解析 DAG 文件（Airflow 3 起必须单独运行）
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
  pg-data:
  grafana-data:
  airflow-logs: