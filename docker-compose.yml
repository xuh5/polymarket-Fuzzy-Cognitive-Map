services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    restart: unless-stopped          # Docker 启动时自动把 Kafka 拉起来
    ports:
      - "9092:9092"                  # 台式机上的 Python 程序从这个口连 Kafka
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller    # 一个节点身兼两职，不需要 ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # 写错 topic 名时报错，而不是悄悄新建
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168           # 数据在 Kafka 里保留 7 天
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data         # 数据存在 Docker 卷里，容器重建也不会丢

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"                  # 网页界面
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # 每小时从 Gamma API 拉一次市场，写 pm.raw.markets（含已关闭市场的 tombstone）
  fetch-markets:
    build: .
    image: polymarket-app
    container_name: fetch-markets
    restart: unless-stopped          # 崩溃、Docker 重启后自动拉起
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092   # 容器之间走内部地址
    command: python -m pmdata.ingest.fetch_markets --every 3600
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"              # 日志文件最大 10MB，最多留 5 个，防止日志把硬盘写满
        max-file: "5"

  # 一直运行：WebSocket 采集订单簿/成交写 pm.raw.clob，每小时重新筛一次订阅名单
  collect-clob:
    build: .
    image: polymarket-app            # 和 fetch-markets 共用同一个镜像（第二次构建直接命中缓存）
    container_name: collect-clob
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    command: python -m pmdata.ingest.collect_clob
    logging: *logging

  # 每 10 分钟轮询一次评论接口，新增或有变化的评论写 pm.raw.comments
  collect-comments:
    build: .
    image: polymarket-app
    container_name: collect-comments
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    command: python -m pmdata.ingest.collect_comments --every 600
    logging: *logging

  # 一直运行：读三个 raw topic，每 5 分钟写一批 Parquet 到 data/bronze/（文件写成功后才提交 offset）
  archiver:
    build: .
    image: polymarket-app
    container_name: archiver
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PM_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data             # 归档文件直接落在宿主机 D:\polymarket\data
    stop_grace_period: 60s           # docker stop 后给它时间写完手里的数据再退出（默认只等 10 秒）
    command: python -m pmdata.archive.archiver
    logging: *logging

  # 一直运行：读 pm.raw.clob 重建订单簿、算实时指标，写 pm.metrics.book / pm.metrics.trades
  # 启动时先往回重放 24 小时预热（约 170 万条，一两分钟），之后才开始输出
  metrics:
    build: .
    image: polymarket-app
    container_name: metrics
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    command: python -m pmdata.metrics.run
    logging: *logging

  # 看板用的数据库。密码在 .env（不进 Git），compose 自动读取
  postgres:
    image: postgres:17.6
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"                  # 宿主机程序 / 调试用
    environment:
      POSTGRES_USER: pm
      POSTGRES_DB: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    logging: *logging

  # 一直运行：读 pm.metrics.* 和 pm.raw.markets，upsert 进 Postgres（数据库提交后才提交 offset）
  pg-sink:
    build: .
    image: polymarket-app
    container_name: pg-sink
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: python -m pmdata.sink.pg_writer
    logging: *logging

  # 看板：数据源和看板都写成文件放在 grafana/ 下（provisioning），重建容器不会丢
  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:3000:3000"        # 只允许本机访问（VS Code 端口转发算本机），局域网打不开，所以可以免登录
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # 免登录直接看
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin        # 免登录也能改看板
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json   # 打开就是看板
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # 数据源配置文件里用 $POSTGRES_PASSWORD 引用
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    logging: *logging

volumes:
  kafka-data:
  pg-data:
  grafana-data: